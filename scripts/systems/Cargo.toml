[package]
name = "game-systems"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
name = "systems"
crate-type = ["cdylib"]

[dependencies]
script-sdk = { path = "../../lib/script-sdk" }
script-sdk-2 = { path = "../../lib/script-sdk-2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = "debuginfo"
